# Same workflow as .github/workflows/test.yml.
# `sh test.sh` runs the PHP checks and `node --test test/*.js` (a directory argument fails on Node 22).

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: sh test.sh
